<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} — Ruby for Good{% else %}Ruby for Good — Making the world gooder, one gem at a time.{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}Ruby for Good is a community of developers, designers, and organizers building open-source software for nonprofits since 2013.{% endif %}">
<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — Ruby for Good{% else %}Ruby for Good{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}Open-source software, built by volunteers, for the nonprofits making the world better.{% endif %}">
<meta property="og:image" content="https://rubyforgood.org{{ site.social_share_image }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ site.classic-logo }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/modern.css">
</head>
