<header class="rg-team-banner">
  <div class="rg-wrap">
    <p class="rg-kicker">About Ruby for Good</p>
    <h1 class="rg-title">Meet our team.</h1>
    <p class="rg-lead">{{ page.description }}</p>
  </div>
</header>

{% assign members = site.our-team | sort: 'list_order' %}
<ul class="rg-wrap rg-team-list" aria-label="Team members">
  {% for member in members %}
    <li>
      <a class="rg-person-card" href="{{ member.url | relative_url }}">
        <img class="rg-portrait" src="{{ member.photo | relative_url }}" alt="" width="144" height="144">
        <div class="rg-person-label">
          <h2>{{ member.first_name }} {{ member.last_name }}</h2>
          <p>{{ member.position }}</p>
        </div>
        <span class="rg-profile-arrow" aria-hidden="true">→</span>
      </a>
    </li>
  {% endfor %}
</ul>
