<form class="rg-subscribe" action="{{ site.mailchimp_list }}" method="post">
  <label for="newsletter-email">Your email address</label>
  <div>
    <input id="newsletter-email" name="EMAIL" type="email" placeholder="you@example.org" required autocomplete="email">
    <span class="rg-honeypot" aria-hidden="true"><input type="text" name="{{ site.mailchimp_input_name }}" tabindex="-1" autocomplete="off"></span>
    <button class="rg-button" type="submit">Subscribe</button>
  </div>
</form>
