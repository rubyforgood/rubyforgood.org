<section class="rg-wrap rg-section">
  <p class="rg-kicker">Partner directory</p><h2>Explore the work.</h2>
  <ul class="rg-directory">
    {% assign projects = site.our-projects | sort: 'title' %}
    {% for project in projects %}
      <li><a href="{% if project.website %}{{ project.website }}{% else %}{{ project.url | relative_url }}{% endif %}"><img src="{{ project.image | relative_url }}" alt="" width="50" height="50" loading="lazy">{{ project.title }} <span aria-hidden="true">↗</span></a></li>
    {% endfor %}
  </ul>
</section>
