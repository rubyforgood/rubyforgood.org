{% include modern/head.html %}
<body class="page">
{% include modern/nav.html %}

<main>
  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/">Home</a>
        {% if page.section %}<span class="sep">/</span><a href="{{ page.section_url }}">{{ page.section }}</a>{% endif %}
        <span class="sep">/</span><span>{{ page.title }}</span>
      </nav>
      <div class="page-hero-grid">
        <h1>{{ page.headline | default: page.title }}</h1>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </div>
    </div>
  </section>

  <section class="section-pad">
    <div class="wrap">
      {{ content }}
    </div>
  </section>
</main>

{% include modern/footer.html %}

<script>
  (function(){
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
    document.querySelectorAll('[data-reveal]').forEach(function(el){ io.observe(el); });
  })();
</script>
</body>
</html>
